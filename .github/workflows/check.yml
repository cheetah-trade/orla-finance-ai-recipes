name: check

on:
  push:
  pull_request:

# Read only. No secrets are used, and pull requests from forks run with the
# same read-only token as everyone else (pull_request, never pull_request_target).
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Actions pinned to a commit, not a tag: a moved tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # No npm install: the check has no dependencies.
      - run: node scripts/check.mjs
